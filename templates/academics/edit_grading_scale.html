{% extends "base.html" %}
{% block title %}Edit Grade Band{% endblock %}
{% block content %}
<h3 class="mb-4">Edit Grade Band &mdash; {{ band.grade }}</h3>
<div class="card p-4" style="max-width: 500px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Grade</label>{{ form.grade }}</div>
        <div class="mb-3"><label class="form-label">Minimum Score</label>{{ form.min_score }}</div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'academics:manage_grading_scale' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
