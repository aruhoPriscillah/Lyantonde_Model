{% extends "base.html" %}
{% block title %}Manage Subjects{% endblock %}
{% block content %}
<h3 class="mb-4">Manage Subjects</h3>
<div class="row">
    <div class="col-md-5">
        <div class="card p-4">
            <h5>Add Subject</h5>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">{{ form.name }}</div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card p-3">
            <h5>Existing Subjects</h5>
            <table class="table">
                <thead><tr><th>Subject</th><th></th></tr></thead>
                <tbody>
                {% for s in subjects %}
                    <tr>
                        <td>{{ s.name }}</td>
                        <td><a href="{% url 'academics:delete_subject' s.pk %}" class="btn btn-sm btn-outline-danger">Delete</a></td>
                    </tr>
                {% empty %}
                    <tr><td colspan="2" class="text-center text-muted">No subjects added yet.</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
