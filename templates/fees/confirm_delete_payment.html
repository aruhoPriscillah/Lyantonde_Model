{% extends "base.html" %}
{% block title %}Delete Payment{% endblock %}
{% block content %}
<h3 class="mb-4">Delete Payment</h3>
<div class="card p-4" style="max-width:500px;">
    <p>Delete the payment of <strong>{{ payment.amount }}</strong> ({{ payment.get_term_display }} {{ payment.year }}) for <strong>{{ payment.student.full_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'fees:student_fee_detail' payment.student.pk %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
